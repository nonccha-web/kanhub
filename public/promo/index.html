<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E10501">
<title>โปรโมชั่น — KAN</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<!--
  หน้าโปรโมชั่นสำหรับลูกค้า — ใส่ในริชเมนู LINE OA (นนท์ 28 ก.ย. 69)
  ข้อมูลมาจากปฏิทินการตลาดหลังบ้านผ่าน /api/promos (ไม่ต้องล็อกอิน · ส่งออกเฉพาะข้อมูลที่ลูกค้าควรเห็น)
  ลูกค้าเห็นล่วงหน้าแค่ 1 วัน · แยกสาขาด้วย ?b=surat | chumphon | fashion | hub
-->
<style>
  :root{ --ink:#1A1917; --soft:#4A4843; --mut:#8A877E; --line:#E6E3DC; --paper:#fff; --ground:#F6F4EF;
         --brand:#E10501; --brand-ink:#B00400; }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--ground); color:var(--ink);
        font:16px/1.6 "Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .hero{ background:var(--brand); color:#fff; padding:22px 18px 20px; padding-top:calc(22px + env(safe-area-inset-top)); }
  .hero-in{ max-width:560px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .hero img{ width:48px; height:48px; border-radius:12px; background:#fff; object-fit:contain; padding:4px; flex:none; }
  .hero-k{ font-size:12px; font-weight:700; letter-spacing:.24em; opacity:.85; }
  .hero h1{ margin:0; font-size:27px; line-height:1.15; font-weight:800; letter-spacing:.01em; }
  .hero p{ margin:3px 0 0; font-size:13.5px; opacity:.9; }
  .tabs{ position:sticky; top:0; z-index:5; background:var(--ground); border-bottom:1px solid var(--line); }
  .tabs-in{ max-width:560px; margin:0 auto; display:flex; gap:8px; overflow-x:auto; padding:12px 16px; scrollbar-width:none; }
  .tabs-in::-webkit-scrollbar{ display:none; }
  .tab{ flex:none; border:1.5px solid var(--line); background:var(--paper); color:var(--soft); border-radius:999px;
        padding:8px 15px; font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .tab i{ font-style:normal; font-size:12px; color:var(--mut); margin-left:6px; font-weight:500; }
  .tab.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .tab.on i{ color:rgba(255,255,255,.7); }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  .sec{ font-size:14px; font-weight:700; color:var(--soft); margin:6px 2px 10px; display:flex; align-items:center; gap:8px; }
  .sec::after{ content:""; flex:1; height:1px; background:var(--line); }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:16px; }
  .banner{ display:block; width:100%; border:0; padding:0; background:#EFECE5; cursor:zoom-in; }
  .banner img{ display:block; width:100%; height:auto; max-height:80vh; object-fit:contain; }
  .thumbs{ display:flex; gap:6px; padding:8px 12px 0; overflow-x:auto; }
  .thumbs button{ flex:none; width:58px; height:58px; border:1px solid var(--line); border-radius:8px; padding:0; overflow:hidden; background:#EFECE5; cursor:zoom-in; }
  .thumbs img{ width:100%; height:100%; object-fit:cover; display:block; }
  .body{ padding:14px 16px 16px; }
  .type{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--soft); }
  .type b{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .soon{ margin-left:8px; font-size:12px; font-weight:700; color:var(--brand-ink); border:1px solid currentColor; border-radius:999px; padding:1px 8px; }
  .card h2{ margin:6px 0 4px; font-size:20px; line-height:1.35; font-weight:700; }
  .when{ font-size:14.5px; color:var(--soft); }
  .where{ font-size:13px; color:var(--mut); margin-top:2px; }
  .msg{ margin-top:10px; font-size:15px; white-space:pre-wrap; border-top:1px solid var(--line); padding-top:10px; }
  .empty{ text-align:center; padding:48px 18px; color:var(--mut); }
  .empty b{ display:block; color:var(--ink); font-size:17px; margin-bottom:4px; }
  .foot{ text-align:center; color:#B9B5AB; font-size:11.5px; margin-top:26px; }
  .zoom{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; padding:16px; }
  .zoom.on{ display:flex; }
  .zoom img{ max-width:100%; max-height:100%; object-fit:contain; }
  .zoom button{ position:absolute; top:calc(12px + env(safe-area-inset-top)); right:12px; width:40px; height:40px; border-radius:50%;
                border:0; background:rgba(255,255,255,.16); color:#fff; font-size:22px; cursor:pointer; }
  .skel{ height:280px; border-radius:16px; background:linear-gradient(90deg,#EEEBE4 25%,#F6F4EF 50%,#EEEBE4 75%); background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:16px; }
  @keyframes sk{ to{ background-position:-200% 0; } }
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <img src="/img/logo-kanhub.png" alt="KAN">
  <div><div class="hero-k">PROMOTION</div><h1>โปรโมชั่นวันนี้</h1><p id="today">&nbsp;</p></div>
</div></header>
<nav class="tabs" aria-label="เลือกสาขา"><div class="tabs-in" id="tabs"></div></nav>
<main class="wrap" id="list"><div class="skel"></div><div class="skel"></div></main>
<div class="zoom" id="zoom" role="dialog" aria-label="ดูรูปเต็ม"><button type="button" aria-label="ปิด">×</button><img alt=""></div>

<script>
(function () {
  "use strict";
  var BR = [
    { k: "", th: "ทุกสาขา" },
    { k: "surat", th: "Kan Store สุราษฎร์", v: "Kan Store สุราษฎร์" },
    { k: "chumphon", th: "Kan Store ชุมพร", v: "Kan Store ชุมพร" },
    { k: "fashion", th: "Kan Fashion", v: "Kan Fashion" },
    { k: "hub", th: "Kan Hub", v: "Kan Hub" }
  ];
  var MS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  var DW = ["อา.","จ.","อ.","พ.","พฤ.","ศ.","ส."];
  var data = null, cur = "";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
  function d(iso) { var p = iso.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(iso) { var x = d(iso); return DW[x.getDay()] + " " + x.getDate() + " " + MS[x.getMonth()]; }
  function when(p) {
    var a = p.start, b = p.end, t = data.today;
    var head = p.tomorrow ? "เริ่มพรุ่งนี้ " + fmt(a) : (a < t ? "ตั้งแต่ " + fmt(a) : "วันนี้ " + fmt(a));
    var tail = b !== a ? " – " + fmt(b) : "";
    var tm = p.t1 && p.t2 ? " · " + p.t1.replace(":", ".") + "–" + p.t2.replace(":", ".") + " น." : (p.t1 ? " · เริ่ม " + p.t1.replace(":", ".") + " น." : "");
    return head + tail + tm;
  }
  function img(id, thumb) { return "/api/promos/img/" + encodeURIComponent(id) + (thumb ? "?s=thumb" : ""); }
  function card(p) {
    var pics = p.images || [];
    return '<article class="card">' +
      (pics.length ? '<button type="button" class="banner" data-z="' + esc(pics[0]) + '"><img src="' + img(pics[0]) + '" alt="' + esc(p.name) + '" loading="lazy" decoding="async"></button>' : "") +
      (pics.length > 1 ? '<div class="thumbs">' + pics.slice(1).map(function (id) {
        return '<button type="button" data-z="' + esc(id) + '"><img src="' + img(id, 1) + '" alt="" loading="lazy"></button>';
      }).join("") + "</div>" : "") +
      '<div class="body"><span class="type"><b style="background:' + esc(p.color) + '"></b>' + esc(p.type) + "</span>" +
      (p.tomorrow ? '<span class="soon">เริ่มพรุ่งนี้</span>' : "") +
      "<h2>" + esc(p.name) + "</h2>" +
      '<div class="when">' + esc(when(p)) + "</div>" +
      '<div class="where">' + esc(p.branches.join(" · ")) + "</div>" +
      (p.message ? '<div class="msg">' + esc(p.message) + "</div>" : "") +
      "</div></article>";
  }
  function render() {
    var b = BR.filter(function (x) { return x.k === cur; })[0] || BR[0];
    var list = (data.promos || []).filter(function (p) { return !b.v || p.branches.indexOf(b.v) !== -1; });
    $("tabs").innerHTML = BR.map(function (x) {
      var n = (data.promos || []).filter(function (p) { return !x.v || p.branches.indexOf(x.v) !== -1; }).length;
      return '<button type="button" class="tab' + (x.k === cur ? " on" : "") + '" data-b="' + x.k + '">' + esc(x.th) + "<i>" + n + "</i></button>";
    }).join("");
    var now = list.filter(function (p) { return !p.tomorrow; }), soon = list.filter(function (p) { return p.tomorrow; });
    var h = "";
    if (!list.length) {
      h = '<div class="empty"><b>ตอนนี้ยังไม่มีโปรโมชั่น' + (b.v ? "ที่ " + esc(b.th) : "") + "</b>แวะมาดูใหม่พรุ่งนี้นะคะ</div>";
    } else {
      if (now.length) h += '<div class="sec">วันนี้</div>' + now.map(card).join("");
      if (soon.length) h += '<div class="sec">พรุ่งนี้</div>' + soon.map(card).join("");
    }
    $("list").innerHTML = h + '<div class="foot">Powered by M Creation</div>';
  }
  function setBranch(k) {
    cur = k;
    try { localStorage.setItem("kan-promo-b", k); } catch (e) {}
    var u = new URL(location.href);
    if (k) u.searchParams.set("b", k); else u.searchParams.delete("b");
    history.replaceState(null, "", u.pathname + u.search);
    render();
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-b]");
    if (t) { setBranch(t.getAttribute("data-b")); window.scrollTo({ top: 0 }); return; }
    var z = e.target.closest("[data-z]");
    if (z) { var zm = $("zoom"); zm.querySelector("img").src = img(z.getAttribute("data-z")); zm.classList.add("on"); return; }
    if (e.target.closest("#zoom")) $("zoom").classList.remove("on");
  });
  /* สาขาจากลิงก์ริชเมนู (?b=) มาก่อน ไม่มีค่อยใช้ที่ลูกค้าเลือกไว้ครั้งก่อน */
  var q = new URLSearchParams(location.search).get("b");
  if (q !== null && BR.some(function (x) { return x.k === q; })) cur = q;
  else { try { var sv = localStorage.getItem("kan-promo-b"); if (sv && BR.some(function (x) { return x.k === sv; })) cur = sv; } catch (e) {} }
  fetch("/api/promos", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
    data = j;
    var t = d(j.today);
    $("today").textContent = "อัปเดต " + ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][t.getDay()] + "ที่ " + t.getDate() + " " + MS[t.getMonth()] + " " + String(t.getFullYear() + 543).slice(2) + " · ดูล่วงหน้าได้ 1 วัน";
    render();
  }).catch(function () {
    $("list").innerHTML = '<div class="empty"><b>โหลดโปรโมชั่นไม่สำเร็จ</b>ลองกดรีเฟรชอีกครั้งนะคะ</div>';
  });
})();
</script>
</body>
</html>
