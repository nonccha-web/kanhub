<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>แจ้งปัญหา — KAN</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root{ --ink:#1A1917; --soft:#4A4843; --mut:#8A877E; --line:#E3E1DA; --hair:#F1EFE9;
         --paper:#fff; --ground:#F6F4EF; --accent:#F2565A; --ok:#1FA968; --bad:#C43D42; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ground); color:var(--ink);
        font:16px/1.65 "Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:26px 18px 60px; }
  .head{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .head img{ height:34px; width:auto; object-fit:contain; }
  .head b{ display:block; font-size:18px; font-weight:700; }
  .head small{ color:var(--mut); font-size:13px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px 18px 22px; }
  h1{ margin:0 0 6px; font-size:21px; font-weight:700; }
  .lead{ margin:0 0 20px; color:var(--soft); font-size:14.5px; }
  label{ display:block; font-size:14px; font-weight:600; margin:0 0 6px; }
  .hint{ font-weight:400; color:var(--mut); font-size:12.5px; }
  .f{ margin-bottom:16px; }
  input,textarea,select{ width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px;
    font:inherit; font-size:15px; background:var(--paper); color:var(--ink); }
  input:focus,textarea:focus,select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  textarea{ min-height:120px; resize:vertical; }
  .who{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .who button{ padding:14px 10px; border:1.5px solid var(--line); border-radius:12px; background:var(--paper);
    font:inherit; font-size:15px; font-weight:600; cursor:pointer; color:var(--soft); text-align:center; }
  .who button b{ display:block; font-size:15px; }
  .who button small{ display:block; font-weight:400; font-size:12px; color:var(--mut); margin-top:2px; }
  .who button.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .who button.on small{ color:rgba(255,255,255,.75); }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .send{ width:100%; padding:15px; border:0; border-radius:12px; background:var(--accent); color:#fff;
    font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .send:disabled{ opacity:.55; cursor:wait; }
  .msg{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; display:none; }
  .msg.err{ display:block; background:#fdecec; color:var(--bad); }
  .foot{ margin-top:18px; text-align:center; color:var(--mut); font-size:12px; }
  .done{ text-align:center; padding:12px 0 4px; }
  .done .tick{ width:58px; height:58px; margin:0 auto 14px; border-radius:50%; background:var(--ok); color:#fff;
    font-size:30px; display:grid; place-items:center; }
  .done h2{ margin:0 0 8px; font-size:20px; }
  .done p{ margin:0 0 6px; color:var(--soft); font-size:14.5px; }
  .done .no{ display:inline-block; margin:10px 0 16px; padding:8px 16px; border:1px dashed var(--line);
    border-radius:10px; font-weight:700; letter-spacing:.04em; }
  .again{ padding:12px 20px; border:1px solid var(--line); border-radius:10px; background:var(--paper);
    font:inherit; font-size:14px; cursor:pointer; color:var(--soft); }
  .hp{ position:absolute; left:-9999px; }
  @media (max-width:420px){ .row, .who{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="/img/logo-kanhub.png" alt="">
    <div><b>แจ้งปัญหา</b><small>บอกเรา เดี๋ยวทีมงานติดต่อกลับ</small></div>
  </div>

  <div class="card" id="card">
    <h1>มีอะไรให้ช่วยบอกได้เลย</h1>
    <p class="lead">กรอกสั้น ๆ ก็พอ ทีมงานจะติดต่อกลับตามช่องทางที่ให้ไว้</p>

    <form id="tf" autocomplete="on">
      <label>คุณคือใคร</label>
      <div class="who">
        <button type="button" class="on" data-kind="customer"><b>ลูกค้า</b><small>ซื้อของ / สอบถาม</small></button>
        <button type="button" data-kind="team"><b>ทีม KAN</b><small>พนักงานในร้าน</small></button>
      </div>

      <div class="f">
        <label for="subject">เรื่องที่จะแจ้ง</label>
        <input id="subject" name="subject" maxlength="150" required placeholder="เช่น ของที่ได้ไม่ครบ / เครื่องสแกนเสีย">
      </div>

      <div class="f">
        <label for="detail">เล่าให้ฟังหน่อย <span class="hint">มีรายละเอียดยิ่งดี</span></label>
        <textarea id="detail" name="detail" maxlength="3000" required placeholder="เกิดอะไรขึ้น · เมื่อไหร่ · สาขาไหน"></textarea>
      </div>

      <div class="f">
        <label for="name">ชื่อที่ให้เราเรียก</label>
        <input id="name" name="name" maxlength="80" required placeholder="ชื่อเล่นก็ได้">
      </div>

      <div class="f">
        <label>ติดต่อกลับทางไหน</label>
        <div class="row">
          <select id="channel" name="channel" aria-label="ช่องทาง">
            <option value="phone">เบอร์โทร</option>
            <option value="line">LINE</option>
            <option value="facebook">Facebook</option>
            <option value="email">อีเมล</option>
          </select>
          <input id="contact" name="contact" maxlength="120" required placeholder="08x-xxx-xxxx">
        </div>
      </div>

      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="send" id="send">ส่งเรื่อง</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <p class="foot">Powered by <b>M Creation</b></p>
</div>

<script>
(function () {
  var kind = 'customer';
  var PLACE = { phone: '08x-xxx-xxxx', line: 'ไอดีไลน์', facebook: 'ชื่อเฟซบุ๊ก', email: 'you@example.com' };
  document.querySelectorAll('[data-kind]').forEach(function (b) {
    b.addEventListener('click', function () {
      kind = b.getAttribute('data-kind');
      document.querySelectorAll('[data-kind]').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.getElementById('subject').placeholder = kind === 'team'
        ? 'เช่น เครื่องสแกนเสีย / ระบบเข้าไม่ได้' : 'เช่น ของที่ได้ไม่ครบ / อยากเปลี่ยนสินค้า';
    });
  });
  var ch = document.getElementById('channel'), ct = document.getElementById('contact');
  ch.addEventListener('change', function () { ct.placeholder = PLACE[ch.value] || ''; ct.value = ''; });

  document.getElementById('tf').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('send'), msg = document.getElementById('msg');
    var body = {
      kind: kind,
      subject: document.getElementById('subject').value.trim(),
      detail: document.getElementById('detail').value.trim(),
      name: document.getElementById('name').value.trim(),
      channel: ch.value,
      contact: ct.value.trim(),
      website: (document.querySelector('[name="website"]') || {}).value || ''
    };
    btn.disabled = true; btn.textContent = 'กำลังส่ง…'; msg.className = 'msg';
    fetch('/api/tickets', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'ส่งไม่สำเร็จ'); return j; }); })
      .then(function (j) {
        document.getElementById('card').innerHTML =
          '<div class="done"><div class="tick">✓</div>' +
          '<h2>ได้รับเรื่องแล้ว</h2>' +
          '<p>ทีมงานจะติดต่อกลับทางที่คุณให้ไว้</p>' +
          '<div class="no">เลขที่เรื่อง ' + (j.ref || '-') + '</div>' +
          '<div><button type="button" class="again" onclick="location.reload()">แจ้งเรื่องอื่นอีก</button></div></div>';
        window.scrollTo(0, 0);
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'ส่งเรื่อง';
        msg.className = 'msg err'; msg.textContent = e.message;
      });
  });
}());
</script>
</body>
</html>
