<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../assets/favicon.png">
<title>งานทีม — KAN Admin</title>
<script>
/* ธีม + สถานะย่อเมนู ต้องใส่ก่อนวาดหน้า ไม่งั้นกะพริบ */
try {
  if (localStorage.getItem('kan-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  if (localStorage.getItem('kan-erp-collapsed') === '1') document.documentElement.classList.add('erp-collapsed');
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tasks.css?v=1">
</head>
<body>
<div class="erp-scrim" data-erp-close="1"></div>
<div class="erp-topbar">
  <button type="button" aria-label="เปิดเมนู" data-erp-toggle>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <img src="../assets/kan-logo.png" alt=""><b>KAN Admin</b>
  <span class="erp-topbar-r" id="topbarUser"></span>
</div>

<div class="layout">
  <aside class="erp-sidebar" id="sideHost"></aside>

  <main>
    <header class="erp-head">
      <div class="erp-head-t">
        <b>KAN Admin</b>
        <small>งานทีม · ระบบหลังบ้าน / Internal operations</small>
      </div>
      <div class="erp-head-r">
        <span id="headUser"></span>
        <div class="erp-seg" id="themeSeg" aria-label="ธีมของระบบ">
          <button type="button" data-theme-pick="light" title="โหมดสว่าง" aria-label="โหมดสว่าง">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-theme-pick="dark" title="โหมดมืด" aria-label="โหมดมืด">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="page" id="view">
      <div class="loading">กำลังโหลด…</div>
    </div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<div id="lightbox" class="lightbox" hidden><img alt=""><button type="button" aria-label="ปิด">✕</button></div>

<script src="../cmo/erp-menu.js?v=22"></script>
<script src="tasks.js?v=1"></script>
</body>
</html>
