<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAN MKT — Sales &amp; Stock Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=18">
</head>
<body>
<div class="layout">

  <aside>
    <div id="sideHost"></div>
    <div class="side-foot" id="lastUpdated"></div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <h1 id="pageTitle"></h1>
        <div class="lead" id="pageLead"></div>
      </div>
      <div class="topacts">
        <button class="btn pro" id="proBtn" type="button" aria-pressed="false"></button>
        <button class="btn guide" id="guideBtn">📖 คู่มือใช้งาน</button>
      </div>
    </div>

    <div class="filters" id="filterHost"></div>

    <div id="view"></div>
  </main>

</div>
<div id="guideHost"></div>

<script src="vendor/chart.umd.min.js?v=17"></script>
<script src="../cmo/erp-menu.js?v=19"></script>
<script src="assets/ingest.js?v=17"></script>
<script>
/* ชุดข้อมูลตั้งต้นโหลดก่อน แล้วให้ไฟล์ที่ผู้ใช้อัปโหลด (IndexedDB) ทับทับตามกฎใน
   ingest.js — ต้องเสร็จก่อน core.js จะอ่าน KAN_DATA จึงโหลดสคริปต์ที่เหลือทีหลัง */
window.KAN_INGEST.boot({
  v: '?v=17',
  data: 'data/kan-data.js',
  scripts: ['assets/core.js', 'assets/daterange.js', 'assets/ui.js', 'assets/suggest.js',
            'assets/rules.js', 'assets/views.js', 'assets/views-extra.js',
            'data/ads-data.js', 'assets/views-ads.js',
            'assets/views-data.js', 'assets/guide.js', 'assets/app.js']
}).catch(function (e) {
  document.body.innerHTML = '<div style="font:15px Kanit,sans-serif;padding:40px;color:#C43D42">' +
    'โหลดระบบไม่สำเร็จ: ' + (e && e.message ? e.message : e) + '</div>';
});
</script>
</body>
</html>
