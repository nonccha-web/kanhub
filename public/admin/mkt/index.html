<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="../assets/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAN MKT — Sales &amp; Stock Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=30">
<script>
/* ธีม + สถานะย่อเมนู ใส่ก่อนวาดหน้า (ค่าเดียวกับฝั่ง CMO และงานทีม) */
try {
  if (localStorage.getItem('kan-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  if (localStorage.getItem('kan-erp-collapsed') === '1') document.documentElement.classList.add('erp-collapsed');
} catch (e) {}
</script>
</head>
<body>
<!-- มือถือ: เมนูเป็นลิ้นชักชุดเดียวกับหน้างานทีม/CMO — ฉากดำกดปิด + แถบบนมีปุ่ม ≡ (เดสก์ท็อปซ่อนโดย erp-shell.css) -->
<div class="erp-scrim" data-erp-close="1"></div>
<div class="erp-topbar">
  <button type="button" aria-label="เปิดเมนู" data-erp-toggle>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <img src="../assets/kan-logo.png" alt=""><b>KAN Admin</b>
</div>
<div class="layout">

  <aside class="erp-sidebar">
    <div id="sideHost"></div>
    <div class="side-foot" id="lastUpdated"></div>
    <div class="erp-powered" style="padding:0 8px 6px">Powered by <b>M Creation</b></div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <h1 id="pageTitle"></h1>
        <div class="lead" id="pageLead"></div>
      </div>
      <div class="topacts">
        <button class="btn pro" id="proBtn" type="button" aria-pressed="false"></button>
        <button class="btn guide" id="guideBtn">📖 คู่มือใช้งาน</button>
        <button class="btn guide" id="tourBtn" type="button">🧭 พาทัวร์หน้านี้</button>
      </div>
    </div>

    <div class="filters" id="filterHost"></div>

    <div id="view"></div>
  </main>

</div>
<div id="guideHost"></div>

<script src="vendor/chart.umd.min.js?v=18"></script>
<script src="../cmo/erp-menu.js?v=42"></script>
<script src="assets/ingest.js?v=18"></script>
<script>
/* ชุดข้อมูลตั้งต้นโหลดก่อน แล้วให้ไฟล์ที่ผู้ใช้อัปโหลด (IndexedDB) ทับทับตามกฎใน
   ingest.js — ต้องเสร็จก่อน core.js จะอ่าน KAN_DATA จึงโหลดสคริปต์ที่เหลือทีหลัง */
window.KAN_INGEST.boot({
  v: '?v=32',
  data: 'data/kan-data.js',
  scripts: ['assets/core.js', 'assets/daterange.js', 'assets/ui.js', 'assets/task-add.js', 'assets/suggest.js',
            'assets/rules.js', 'data/sales-insight.js', 'data/promo-analysis.js', 'assets/views.js', 'assets/suggest-sales.js', 'assets/views-extra.js',
            'data/ads-data.js', 'assets/views-ads.js',
            'assets/views-data.js', 'assets/guide.js', 'assets/app.js']
}).catch(function (e) {
  document.body.innerHTML = '<div style="font:15px IBM Plex Sans Thai,sans-serif;padding:40px;color:#C43D42">' +
    'โหลดระบบไม่สำเร็จ: ' + (e && e.message ? e.message : e) + '</div>';
});
</script>
</body>
</html>
