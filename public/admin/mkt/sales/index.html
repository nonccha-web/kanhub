<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="../../assets/favicon.png">
<script>
/* ธีม + สถานะย่อเมนู ต้องตั้งก่อนวาดหน้า (ค่าเดียวกับหน้าอื่นในหลังบ้าน) */
try {
  if (localStorage.getItem('kan-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  if (localStorage.getItem('kan-erp-collapsed') === '1') document.documentElement.classList.add('erp-collapsed');
} catch (e) {}
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แดชบอร์ดยอดขาย — KAN MKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css?v=30">
<style>
  /* หน้านี้เป็นเปลือก: sidebar เดียวกับทั้งระบบ + แดชบอร์ดฝ่ายขายเต็มจอใน iframe */
  main.dash{padding:0;display:flex;min-width:0}
  main.dash iframe{border:0;width:100%;height:100vh;display:block}
  /* มือถือ: แถบบน 52px เป็น fixed — ดันเนื้อหาลงมาไม่ให้โดนทับ (จุดตัดเดียวกับลิ้นชักใน erp-shell.css) */
  @media(max-width:900px){main.dash{padding-top:52px}main.dash iframe{height:calc(100dvh - 52px)}}
</style>
</head>
<body>
<!-- มือถือ: เมนูเป็นลิ้นชักชุดเดียวกับหน้างานทีม/CMO — ฉากดำกดปิด + แถบบนมีปุ่ม ≡ (เดสก์ท็อปซ่อนโดย erp-shell.css) -->
<div class="erp-scrim" data-erp-close="1"></div>
<div class="erp-topbar">
  <button type="button" aria-label="เปิดเมนู" data-erp-toggle>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <img src="../../assets/kan-logo.png" alt=""><b>KAN Admin</b>
</div>
<div class="layout">
  <aside class="erp-sidebar">
    <div id="sideHost"></div>
    <div class="side-foot"><span class="dot"></span>แดชบอร์ดฝ่ายขาย — ไฟล์เต็มทุกแท็บ</div>
  </aside>
  <main class="dash">
    <iframe id="dash" src="dashboard.html" title="แดชบอร์ดยอดขายฝ่ายขาย"></iframe>
  </main>
</div>
<script src="../../cmo/erp-menu.js?v=45"></script>
<script>
(function () {
  'use strict';
  var host = document.getElementById('sideHost');
  function draw(me) {
    if (!window.ERP_MENU || !host) { return; }
    host.innerHTML = window.ERP_MENU.render({
      ctx: 'cmo',                       /* ไม่ใช่แอป hash-router — ลิงก์ sales ต้องพาไป ../index.html */
      active: 'sales:sales/',
      salesBase: '../index.html',
      cmoBase: '../../cmo/',
      tasksBase: '../../tasks/',
      assetsBase: '../../assets/',      /* หน้านี้ลึกกว่าหน้าอื่นหนึ่งชั้น โลโก้ในเมนูถึงจะโหลดติด */
      sections: me ? me.sections : null,
      owner: !!me && me.role === 'owner'
    });
    window.ERP_MENU.wire(host);
  }
  draw(null);
  fetch('/api/t/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (j) {
      if (!j || !j.me) { return; }
      j.me.sections = j.sections || j.me.sections || [];
      draw(j.me);
    });
  /* ส่ง #peek=... ต่อให้แดชบอร์ดใน iframe (ลิงก์ "เปิดหน้าเต็ม" จากหน้าโปรใช้ทางนี้) */
  var dash = document.getElementById('dash');
  if (location.hash) { dash.src = 'dashboard.html' + location.hash; }
  /* ลิ้นชักเมนูมือถือ — ชุดเดียวกับ tasks.js / nav.js */
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-erp-toggle]')) { document.documentElement.classList.toggle('erp-open'); return; }
    if (ev.target.closest('[data-erp-close]')) { document.documentElement.classList.remove('erp-open'); return; }
    if (document.documentElement.classList.contains('erp-open') && ev.target.closest('.erp-sidebar a')) document.documentElement.classList.remove('erp-open');
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') document.documentElement.classList.remove('erp-open'); });
  window.addEventListener('hashchange', function () {
    try { dash.contentWindow.location.hash = location.hash; } catch (e) { /* ข้าม */ }
  });
})();
</script>
</body>
</html>
