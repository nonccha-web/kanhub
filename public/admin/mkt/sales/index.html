<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="../../assets/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แดชบอร์ดยอดขาย — KAN MKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css?v=23">
<style>
  /* หน้านี้เป็นเปลือก: sidebar เดียวกับทั้งระบบ + แดชบอร์ดฝ่ายขายเต็มจอใน iframe */
  main.dash{padding:0;display:flex;min-width:0}
  main.dash iframe{border:0;width:100%;height:100vh;display:block}
  @media(max-width:820px){main.dash iframe{height:calc(100vh - 60px)}}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div id="sideHost"></div>
    <div class="side-foot"><span class="dot"></span>แดชบอร์ดฝ่ายขาย — ไฟล์เต็มทุกแท็บ</div>
  </aside>
  <main class="dash">
    <iframe id="dash" src="dashboard.html" title="แดชบอร์ดยอดขายฝ่ายขาย"></iframe>
  </main>
</div>
<script src="../../cmo/erp-menu.js?v=22"></script>
<script>
(function () {
  'use strict';
  var host = document.getElementById('sideHost');
  if (window.ERP_MENU && host) {
    host.innerHTML = window.ERP_MENU.render({
      ctx: 'cmo',                       /* ไม่ใช่แอป hash-router — ลิงก์ sales ต้องพาไป ../index.html */
      active: 'sales:sales/',
      salesBase: '../index.html',
      cmoBase: '../../cmo/',
    });
    window.ERP_MENU.wire(host);
  }
  /* ส่ง #peek=... ต่อให้แดชบอร์ดใน iframe (ลิงก์ "เปิดหน้าเต็ม" จากหน้าโปรใช้ทางนี้) */
  var dash = document.getElementById('dash');
  if (location.hash) { dash.src = 'dashboard.html' + location.hash; }
  window.addEventListener('hashchange', function () {
    try { dash.contentWindow.location.hash = location.hash; } catch (e) { /* ข้าม */ }
  });
})();
</script>
</body>
</html>
